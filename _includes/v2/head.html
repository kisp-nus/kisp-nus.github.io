<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        // Theme before first paint: ?theme= URL param wins, then saved choice.
        (function () {
            try {
                var p = new URLSearchParams(location.search).get('theme');
                var t = (p === 'light' || p === 'dark') ? p : localStorage.getItem('theme');
                if (p === 'light' || p === 'dark') localStorage.setItem('theme', p);
                if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
            } catch (e) {}
        })();
    </script>
    <title>KISP Lab — {{ page.labslogan | default: site.description }}</title>
    <meta name="description" content="{{ site.description }}">
    <meta property="og:title" content="KISP Lab">
    <meta property="og:description" content="{{ site.description }}">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/v2.css' | relative_url }}">
</head>

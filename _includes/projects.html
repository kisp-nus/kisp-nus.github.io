<style>
    .projects-container {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        padding-bottom: 100px;
    }
    .project {
        position: static;
        text-align: center;
        margin: 10px;
        width: 33.333333%;
        transition: transform 0.2s;
    }
    .project-icon-img {
        object-fit: cover;
        object-position: center;
        height: 150px;
        width: 150px;
        cursor: pointer;
    }
    /* Mobile-first: description sits in the normal flow, always visible */
    .project-description {
        width: 100%;
        margin-top: 10px;
        padding: 10px;
    }

    /* Small screens: stack projects in a column, descriptions shown inline */
    @media (max-width: 767px) {
        .projects-container {
            flex-direction: column;
            align-items: center;
            padding-bottom: 20px;
        }

        .project {
            width: 90%;
            margin: 10px;
        }
    }

    /* Medium screens and up: lay projects out in a row and turn the
       description into a floating overlay that fades in on hover, so
       revealing it never reflows the page. */
    @media (min-width: 768px) {
        .md\:projects-container {
            flex-direction: row;
            align-items: center;
            padding-bottom: 20px;
        }

        .md\:project {
            width: 25%;
            margin: 20px;
            position: relative;
        }

        .project:hover {
            transform: scale(1.2);
            z-index: 10;
        }

        .project-description {
            position: absolute;
            left: 50%;
            top: 100%;
            transform: translateX(-50%) translateY(-6px);
            width: 200px;
            margin-top: 0;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .project:hover .project-description {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }
    }

    @media (min-width: 1024px) {
        .lg\:project {
            width: 20%;
        }
    }

    @media (min-width: 1280px) {
        .xl\:project {
            width: 16.666667%;
        }
    }
</style>

<div class="bg-white pt-8 pb-4 sm:pt-16 sm:pb-6">
    <div class="px-6 text-center">
        <h1 class="inline-block text-4xl font-semibold text-gray-900">
            Projects
        </h1>
    </div>

    <div class="projects-container sm:projects-container md:projects-container lg:projects-container xl:projects-container">
        {% for project in site.data.onepage.projects %}
        <div class="project sm:project md:project lg:project xl:project">
            <div class="p-4">
                <div class="project-icon">
                    <a href="{{ project.url }}">
                        <img class="mx-auto project-icon-img" alt="{{ project.name }}" src="{{ project.image | relative_url }}">
                    </a>
                </div>
                <div class="mx-auto mt-2 text-center leading-tight"><a href="{{ project.url }}">{{ project.name }}</a></div>
                <div class="mx-auto mt-1 text-center leading-tight font-light">{{ project.fullname }}</div>
                <div class="project-description md:project-description lg:project-description xl:project-description
                px-2 py-2 rounded-sm text-center text-sm md:text-base lg:text-l text-white bg-indigo-900">
                    {{ project.description }}
                </div>
            </div>
        </div>
        {% endfor %}
    </div>


</div>

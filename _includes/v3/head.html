<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        // Apply saved theme before first paint to avoid a flash (default: dark).
        (function () {
            try {
                var t = localStorage.getItem('theme-v3');
                if (t) document.documentElement.setAttribute('data-theme', t);
            } catch (e) {}
        })();
    </script>
    <title>KISP Lab // Keep It Secure and Private</title>
    <meta name="description" content="{{ site.description }}">
    <meta name="color-scheme" content="dark light">
    <meta property="og:title" content="KISP Lab">
    <meta property="og:description" content="{{ site.description }}">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/v3.css' | relative_url }}">
</head>
